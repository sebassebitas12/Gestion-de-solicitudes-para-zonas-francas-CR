<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoFranca CR - Acceso al Sistema</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card" aria-labelledby="login-title">
            <header class="login-header">
                <img src="../assets/logo-procomer.png" alt="Logo PROCOMER ZoFranca CR" class="logo">
                <h1 id="login-title">Plataforma de Gestión Zonas Francas</h1>
                <p>Ingrese sus credenciales para continuar</p>
            </header>

            <!-- Contenedor de Alertas Asíncronas -->
            <div id="alert-message" class="alert hidden" role="alert" aria-live="assertive"></div>

            <form id="login-form" class="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="usuario@empresa.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="rol-usuario">Seleccionar Rol</label>
                    <select id="rol-usuario" name="rol-usuario" required>
                        <option value="" disabled selected>Seleccione un rol...</option>
                        <option value="empresa">Empresa Solicitante / Instalada</option>
                        <option value="analista">Analista de Zona Franca</option>
                        <option value="administrador">Administrador</option>
                        <option value="gerente">Gerente / Auditor PROCOMER</option>
                    </select>
                </div>

                <button type="submit" id="btn-login" class="btn btn-primary btn-block">
                    <span id="spinner-loading" class="spinner hidden" aria-hidden="true"></span>
                    <span class="btn-text">Ingresar al Sistema</span>
                </button>
            </form>
        </section>
    </main>
    <script type="module" src="../js/login.js"></script>
</body>
</html>
